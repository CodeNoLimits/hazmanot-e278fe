<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>ההזמנות שלי</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='86' font-size='86'>🎈</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b1f4a;--soft:#7d6689;--rose:#e2477f;--ok:#178a5a;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Rubik,system-ui,sans-serif;color:var(--ink);background:linear-gradient(#ffe3ee,#fff4e2 420px,#fffaf3);min-height:100vh;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
header{max-width:760px;margin:auto;padding:26px 16px 10px;text-align:center}
.star{width:118px;height:118px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 8px 24px #e2477f40}
h1{margin:12px 0 4px;font-size:30px;font-weight:800;line-height:1.15}
header p{margin:0;color:var(--soft);font-size:16px}
.bar{position:sticky;top:0;z-index:2;background:#fff5eeee;backdrop-filter:blur(10px);border-bottom:1px solid #f3d5dd}
.bar>div{max-width:760px;margin:auto;padding:10px 16px}
.n{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:17px}
.n span{font-weight:500;font-size:15px;color:var(--soft)}
.track{height:9px;border-radius:9px;background:#f6d7e1;margin:7px 0 9px;overflow:hidden}.track i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#f39b3f,var(--rose));transition:width .35s}
.f{display:flex;gap:8px}.f button{flex:1;min-height:44px;border:1.5px solid #eec3d0;background:#fff;color:var(--ink);border-radius:12px;font:500 15px Rubik,sans-serif}.f button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
main{max-width:760px;margin:auto;padding:16px;display:grid;gap:13px;grid-template-columns:repeat(2,1fr)}
@media(min-width:560px){main{grid-template-columns:repeat(3,1fr)}}@media(min-width:720px){main{grid-template-columns:repeat(4,1fr)}}
.k{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 3px 14px #7b3a5c1c;border:2px solid transparent;display:flex;flex-direction:column}
.k a{display:block;position:relative;text-decoration:none;color:inherit;flex:1}.k img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.wa{position:absolute;inset-inline-end:9px;top:9px;width:38px;height:38px;border-radius:50%;background:#1fa855;display:grid;place-items:center;box-shadow:0 2px 8px #0004}
.t{padding:9px 12px 5px}.t b{display:block;font-size:18px;font-weight:700;line-height:1.2}.t small{font-size:14px;color:var(--soft)}
.k label{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 12px 10px;font-weight:500;font-size:16px;cursor:pointer}
.k input{appearance:none;-webkit-appearance:none;width:28px;height:28px;margin:0;border:2px solid #cf9db2;border-radius:9px;flex:none;display:grid;place-items:center;background:#fff}
.k input:checked{background:var(--ok);border-color:var(--ok)}.k input:checked:after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.k.done{border-color:#9ed9bd;background:#f1fbf5}.k.done label{color:var(--ok);font-weight:700}.k.done img{opacity:.6}
.k.open:not(.done){border-color:#f3a64d}
.k :focus-visible,.f :focus-visible{outline:3px solid #5a7be0;outline-offset:2px}
.msg{grid-column:1/-1;text-align:center;padding:34px 10px;font-size:18px;color:var(--soft)}
@media(prefers-reduced-motion:reduce){.track i{transition:none}}
</style></head><body>
<header id="h"></header><div class="bar" hidden><div><div class="n"><b id="c"></b><span id="r"></span></div><div class="track"><i id="p"></i></div>
<div class="f"><button data-f="all" aria-pressed="true">כולם</button><button data-f="todo" aria-pressed="false">עוד לא</button><button data-f="done" aria-pressed="false">שלחתי</button></div></div></div>
<main id="m"><div class="msg">רגע…</div></main>
<script>
const K='hazmanot-v1',$=i=>document.getElementById(i);let S={},F='all',L=[];
try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
try{navigator.storage.persist()}catch(e){}
const WA='<svg width="23" height="23" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.8 14.1c-.2.7-1.4 1.3-2 1.4-.5.1-1.200.1-1.900-.1-3.400-1.200-5.600-4.500-5.800-4.700-.2-.3-1.400-1.800-1.400-3.400s.9-2.400 1.200-2.800c.3-.3.6-.4.9-.4h.6c.2 0 .5-.1.7.5l.9 2.200c.1.200.1.300 0 .500l-.8 1c-.2.200-.3.400-.1.700.2.300.9 1.400 1.900 2.300 1.300 1.100 2.400 1.500 2.700 1.600.3.100.5.100.7-.1l1-1.200c.2-.3.4-.2.7-.1l2.100 1c.3.200.5.300.6.400.1.200.1.600-.1 1.200z"/></svg>';
function draw(){const n=L.filter(k=>S[k.t]&&S[k.t].d).length;
 $('c').textContent='שלחתי '+n+' מתוך '+L.length;$('r').textContent=n==L.length?'הכול נשלח 🎉':'נשארו '+(L.length-n);$('p').style.width=100*n/L.length+'%';
 document.querySelectorAll('.k').forEach(e=>{const s=S[e.dataset.t]||{};e.classList.toggle('done',!!s.d);e.classList.toggle('open',!!s.o);
  e.querySelector('input').checked=!!s.d;e.querySelector('label span').textContent=s.d?'שלחתי':'עוד לא שלחתי';e.hidden=F=='todo'?!!s.d:F=='done'?!s.d:false;e.style.display=e.hidden?'none':''})}
(async()=>{try{
 let h=location.hash.slice(1);try{if(h)localStorage.setItem(K+'-k',h);else h=localStorage.getItem(K+'-k')||''}catch(e){}
 const raw=Uint8Array.from(atob(h.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
 const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 const b=new Uint8Array(await(await fetch('d.bin')).arrayBuffer());
 const A=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12))));
 const N=A.find(k=>k.s);L=A.filter(k=>k!==N);
 $('h').innerHTML='<img class="star" alt="'+N.n+'" src="data:image/jpeg;base64,'+N.i+'"><h1>יום ההולדת של '+N.n+'</h1><p>לחיצה על תמונה פותחת את הוואטסאפ</p>';
 $('m').innerHTML=L.map(k=>'<article class="k" data-t="'+k.t+'"><a href="https://wa.me/'+k.t+'" target="_blank" rel="noopener noreferrer" aria-label="וואטסאפ: '+k.n+'"><img alt="'+k.n+'" src="data:image/jpeg;base64,'+k.i+'"><span class="wa">'+WA+'</span><div class="t"><b>'+k.n+'</b><small>'+k.p+'</small></div></a><label><input type="checkbox"><span></span></label></article>').join('');
 document.querySelectorAll('.k').forEach(e=>{const t=e.dataset.t;e.querySelector('a').addEventListener('click',()=>{S[t]={...S[t],o:1};save();draw()});
  e.querySelector('input').addEventListener('change',x=>{S[t]={...S[t],d:x.target.checked?1:0};save();draw()})});
 document.querySelectorAll('.f button').forEach(b=>b.onclick=()=>{F=b.dataset.f;document.querySelectorAll('.f button').forEach(x=>x.setAttribute('aria-pressed',x==b));draw()});
 document.querySelector('.bar').hidden=false;draw();
}catch(e){$('m').innerHTML='<div class="msg">צריך לפתוח את הקישור המלא מהוואטסאפ</div>'}})();
</script></body></html>
